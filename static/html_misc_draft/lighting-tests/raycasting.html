<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pixi v8 – Flashlight Cone Game (Occlusion)</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: #0b0b12;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      .tip {
        position: fixed;
        left: 12px;
        top: 12px;
        color: #e7e7ee;
        font: 14px/1.3 Arial;
        opacity: 0.85;
        user-select: none;
      }
      .tip kbd {
        background: #1f2030;
        padding: 2px 6px;
        border-radius: 6px;
        border: 1px solid #2c2e44;
      }
      .tip .pill {
        background: #1d2b43;
        padding: 2px 6px;
        border-radius: 999px;
        border: 1px solid #2a3b5d;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div class="tip">
      <div><strong>WASD</strong> to move • Flashlight points at your cursor</div>
      <div style="margin-top: 6px">Press <kbd>R</kbd> to reroll obstacles</div>
      <div style="margin-top: 6px" class="pill">Pink = walls • Blue = you</div>
    </div>
    <div id="diag"></div>

    <script type="module">
      import { Application, Graphics, Container, Point } from "https://cdn.jsdelivr.net/npm/pixi.js@8.x/dist/pixi.mjs";

      // ---------- PIXI APP ----------
      const app = new Application();
      await app.init({
        backgroundAlpha: 0,
        antialias: true,
        resolution: Math.min(devicePixelRatio, 2),
        resizeTo: window,
      });
      document.getElementById("game").appendChild(app.canvas);

      // World container for gameplay elements
      const world = new Container();
      app.stage.addChild(world);

      // ---------- STATE ----------
      const state = {
        speed: 260, // pixels / sec
        coneLength: 520, // flashlight reach
        coneWidthDeg: 46, // full cone width in degrees
        obstacles: [],
        slimes: [], // dont block light
        keys: new Set(),
        pointer: new Point(app.screen.width / 2, app.screen.height / 2),
      };

      // Player (blue square)
      const player = new Graphics().rect(0, 0, 28, 28).fill({ color: 0x3b82f6 });
      player.pivot.set(14, 14);
      player.position.set(app.screen.width / 2, app.screen.height / 2);
      world.addChild(player);

      // Obstacles (pink rounded rectangles)
      const obstaclesLayer = new Container();
      const slimesLayer = new Container();
      world.addChild(obstaclesLayer, slimesLayer);

      function rerollObstacles() {
        obstaclesLayer.removeChildren();
        state.obstacles.length = 0;
        slimesLayer.removeChildren();
        state.slimes.length = 0;
        const W = app.screen.width,
          H = app.screen.height;
        const count = Math.round((W * H) / 60000); // density scales with area

        for (let i = 0; i < count; i++) {
          const w = 50 + Math.random() * 140;
          const h = 40 + Math.random() * 120;
          const x = Math.random() * (W - w) + w / 2;
          const y = Math.random() * (H - h) + h / 2;

          // Keep initial spawn from surrounding the player too closely
          const dx = x - player.x,
            dy = y - player.y;
          if (Math.hypot(dx, dy) < 120) {
            i--;
            continue;
          }

          const r = new Graphics().roundRect(0, 0, w, h, 8).fill({ color: 0xff6bb3 });
          r.pivot.set(w / 2, h / 2);
          r.position.set(x, y);

          // Store physical dims for raycasting
          r._w = w;
          r._h = h;

          obstaclesLayer.addChild(r);
          state.obstacles.push(r);
        }
        const gcount = Math.round((W * H) / 90000); // a bit sparser than walls
        for (let i = 0; i < gcount; i++) {
          const rad = 7 + Math.random() * 10;
          const x = Math.random() * (W - 2 * rad) + rad;
          const y = Math.random() * (H - 2 * rad) + rad;
          // keep spawn from being right on top of the player
          if (Math.hypot(x - player.x, y - player.y) < 60) {
            i--;
            continue;
          }
          const g = new Graphics().circle(0, 0, rad).fill({ color: 0x22c55e }); // green
          g.position.set(x, y);
          slimesLayer.addChild(g);
          state.slimes.push(g);
        }
      }
      rerollObstacles();

      // ---------- DARKNESS + MASK ----------
      const visionMask = new Graphics();
      const darkness = new Graphics();
      function drawDarknessRect() {
        darkness.clear().rect(0, 0, app.screen.width, app.screen.height).fill({ color: 0x000000, alpha: 0.95 });
      }
      drawDarknessRect();

      // Inverse mask: we "cut out" the lit area from the black overlay
      darkness.setMask({ mask: visionMask, inverse: true });
      app.stage.addChild(darkness, visionMask);

      // Resize handling for overlay
      window.addEventListener("resize", () => {
        drawDarknessRect();
      });

      // ---------- INPUT ----------
      window.addEventListener("keydown", (e) => {
        const k = e.key.toLowerCase();
        if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright"].includes(k)) state.keys.add(k);
        if (k === "r") rerollObstacles();
      });
      window.addEventListener("keyup", (e) => state.keys.delete(e.key.toLowerCase()));

      // Pointer tracking
      app.stage.eventMode = "static";
      app.stage.hitArea = app.screen;
      app.stage.on("pointermove", (e) => state.pointer.copyFrom(e.global));

      // ---------- UTILS ----------
      const TAU = Math.PI * 2;
      const ANG_EPS = 0.0003; // small offset to sample around obstacle corners
      const HIT_PAD = 0.5; // pull ray back a hair from the intersect
      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }
      function normalizeAngle(a) {
        // [-PI, PI)
        while (a <= -Math.PI) a += TAU;
        while (a > Math.PI) a -= TAU;
        return a;
      }

      function updatePlayer(dt) {
        let vx = 0,
          vy = 0;
        if (state.keys.has("w") || state.keys.has("arrowup")) vy -= 1;
        if (state.keys.has("s") || state.keys.has("arrowdown")) vy += 1;
        if (state.keys.has("a") || state.keys.has("arrowleft")) vx -= 1;
        if (state.keys.has("d") || state.keys.has("arrowright")) vx += 1;
        if (vx || vy) {
          const l = Math.hypot(vx, vy) || 1;
          vx /= l;
          vy /= l;
          player.x += vx * state.speed * dt;
          player.y += vy * state.speed * dt;
        }
        // Stay on screen
        player.x = clamp(player.x, 14, app.screen.width - 14);
        player.y = clamp(player.y, 14, app.screen.height - 14);
      }

      // Build a list of line segments (ax,ay)-(bx,by) for ray intersection
      function gatherSegments() {
        const segs = [];
        for (const r of state.obstacles) {
          const halfW = r._w / 2,
            halfH = r._h / 2;
          const left = r.x - halfW,
            right = r.x + halfW;
          const top = r.y - halfH,
            bottom = r.y + halfH;

          // Rectangle edges, clockwise
          segs.push({ ax: left, ay: top, bx: right, by: top });
          segs.push({ ax: right, ay: top, bx: right, by: bottom });
          segs.push({ ax: right, ay: bottom, bx: left, by: bottom });
          segs.push({ ax: left, ay: bottom, bx: left, by: top });
        }
        return segs;
      }

      // Ray (px,py) + t*(dx,dy), t>=0  vs segment A(ax,ay)->B(bx,by)
      function raySegmentIntersection(px, py, dx, dy, seg) {
        const { ax, ay, bx, by } = seg;
        const sx = bx - ax,
          sy = by - ay;

        const denom = dx * sy - dy * sx;
        if (Math.abs(denom) < 1e-8) {
          // Parallel or nearly so; ignore (corner sampling with ANG_EPS handles edge cases)
          return null;
        }

        const qpx = ax - px,
          qpy = ay - py;
        const t = (qpx * sy - qpy * sx) / denom; // along the ray
        const u = (qpx * dy - qpy * dx) / denom; // along the segment [0..1]

        if (t >= 0 && u >= 0 && u <= 1) return t;
        return null;
      }

      // Compute ray hit point distance up to maxLen, clipped by nearest obstacle
      function castRay(px, py, theta, segs, maxLen) {
        const dx = Math.cos(theta),
          dy = Math.sin(theta);
        let best = maxLen;
        for (let i = 0; i < segs.length; i++) {
          const t = raySegmentIntersection(px, py, dx, dy, segs[i]);
          if (t !== null && t < best) best = t;
        }
        // Pull back a hair so we don't "poke into" the wall (avoids sprite/precision shimmer)
        if (best > HIT_PAD) best -= HIT_PAD;
        return { x: px + dx * best, y: py + dy * best, dist: best };
      }

      function redrawVisionMask() {
        const px = player.x,
          py = player.y;
        const center = Math.atan2(state.pointer.y - py, state.pointer.x - px);
        const half = (state.coneWidthDeg * Math.PI) / 180 / 2;
        const minRel = -half,
          maxRel = +half;

        // Candidate angles to sample (include cone bounds + obstacle corner angles)
        const cand = [minRel, maxRel];

        // Include angles for each *corner* of each obstacle (±EPS around each)
        for (const r of state.obstacles) {
          const halfW = r._w / 2,
            halfH = r._h / 2;
          const corners = [
            { x: r.x - halfW, y: r.y - halfH },
            { x: r.x + halfW, y: r.y - halfH },
            { x: r.x + halfW, y: r.y + halfH },
            { x: r.x - halfW, y: r.y + halfH },
          ];
          for (const c of corners) {
            const rel = normalizeAngle(Math.atan2(c.y - py, c.x - px) - center);
            if (rel >= minRel - ANG_EPS && rel <= maxRel + ANG_EPS) {
              cand.push(rel - ANG_EPS, rel, rel + ANG_EPS);
            }
          }
        }

        // Sort & dedupe angles
        cand.sort((a, b) => a - b);
        const dedup = [];
        for (let i = 0; i < cand.length; i++) {
          if (i === 0 || Math.abs(cand[i] - cand[i - 1]) > 1e-5) dedup.push(cand[i]);
        }

        const segs = gatherSegments();

        // Cast rays and collect points in angle order
        const pts = [];
        for (const rel of dedup) {
          const theta = center + rel;
          const hit = castRay(px, py, theta, segs, state.coneLength);
          pts.push({ rel, x: hit.x, y: hit.y });
        }

        // Draw visibility: fan polygon (player -> each ray end -> back to player)
        visionMask.clear();

        if (pts.length >= 2) {
          visionMask.moveTo(px, py);
          for (let i = 0; i < pts.length; i++) {
            visionMask.lineTo(pts[i].x, pts[i].y);
          }
          visionMask.lineTo(px, py).fill({ color: 0x00ffcc, alpha: 1 }); // color doesn't matter
        }

        // Small "personal bubble" so you can always see yourself a bit
        visionMask.circle(px, py, 36).fill({ color: 0x00ffcc, alpha: 1 });
      }

      // ---------- TICK ----------
      app.ticker.add(() => {
        const dt = app.ticker.deltaMS / 1000;
        updatePlayer(dt);
        redrawVisionMask();
      });
    </script>
  </body>
</html>
